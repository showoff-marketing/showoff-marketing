name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

      - run: pnpm --filter @showoff/customer-portal exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

      - run: pnpm run build

      - name: Start local Supabase
        run: pnpm dlx supabase@2.119.0 start
      - name: Run migrations and pgTAP tests
        run: pnpm dlx supabase@2.119.0 test db --local
      - name: Stop local Supabase
        if: always()
        run: pnpm dlx supabase@2.119.0 stop --no-backup
